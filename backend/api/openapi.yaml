openapi: 3.1.0
info:
  title: StansiaReco Infrastructure Control Plane API
  description: >
    Production-grade REST API for managing Namecheap domains, DNS records,
    remote Linux servers, encrypted SSH credentials, and remote execution.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local development server
paths:
  /healthz:
    get:
      summary: Liveness Probe
      description: Returns process status
      responses:
        '200':
          description: Process is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: up
                  timestamp:
                    type: string
                    format: date-time

  /readyz:
    get:
      summary: Readiness Probe
      description: Verifies database connectivity
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
                  database:
                    type: string
                    example: connected
        '503':
          description: Service is not ready

  /version:
    get:
      summary: API Version Info
      responses:
        '200':
          description: App details
          content:
            application/json:
              schema:
                type: object
                properties:
                  app:
                    type: string
                  version:
                    type: string
                  environment:
                    type: string

  /auth/login:
    post:
      summary: User Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Authenticated successfully
        '401':
          description: Invalid credentials

  /auth/logout:
    post:
      summary: User Logout
      responses:
        '200':
          description: Session terminated

  /auth/me:
    get:
      summary: Current Authenticated User
      responses:
        '200':
          description: User profile and role
        '401':
          description: Unauthenticated

  /integrations/namecheap/test:
    post:
      summary: Test Namecheap Connection
      responses:
        '200':
          description: API credentials verified

  /integrations/namecheap/sync:
    post:
      summary: Trigger Domain Synchronization
      responses:
        '202':
          description: Sync job queued

  /domains:
    get:
      summary: List Domains
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated domains list

  /domains/{domainID}/dns:
    get:
      summary: List DNS Records for Domain
      responses:
        '200':
          description: Host records
    post:
      summary: Add or replace DNS Records
      responses:
        '200':
          description: DNS mutation accepted

  /servers:
    get:
      summary: List Servers
      responses:
        '200':
          description: Server inventory
    post:
      summary: Register Server
      responses:
        '201':
          description: Server created

  /servers/{serverID}/test-connection:
    post:
      summary: Test SSH Connectivity
      responses:
        '200':
          description: Connection test result

  /credentials:
    get:
      summary: List Credentials (Masked)
      responses:
        '200':
          description: Credential metadata
    post:
      summary: Store New Credential
      responses:
        '201':
          description: Encrypted credential saved

  /executions:
    get:
      summary: List Execution History
      responses:
        '200':
          description: Execution jobs list
    post:
      summary: Trigger Remote Script Execution
      responses:
        '202':
          description: Job queued

  /executions/{executionID}:
    get:
      summary: Get Execution Job Details & Logs
      responses:
        '200':
          description: Job details, exit code, stdout, stderr
